name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npm run lint

      - name: Build production web bundle
        env:
          VITE_BASE_PATH: '/'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '' }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          VITE_GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || '' }}
          VITE_GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 || '' }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 || '' }}
          VITE_GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 || '' }}
          VITE_GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 || '' }}
          VITE_GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 || '' }}
          VITE_GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 || '' }}
          VITE_GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 || '' }}
          VITE_GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 || '' }}
          VITE_GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 || '' }}
          VITE_GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 || '' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '' }}
        run: npm run build

      - name: Initialize & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n\n    <application|' "$MANIFEST"
          fi
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" "$GRADLE_FILE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$GRADLE_FILE"
          fi

      - name: Copy app launcher icons to Android resources
        run: |
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            cp public/pwa-192x192.png "android/app/src/main/res/$dir/ic_launcher.png"
            cp public/pwa-maskable-512x512.png "android/app/src/main/res/$dir/ic_launcher_round.png"
            cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher_foreground.png"
          done

      - name: Build Android Debug & Release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Prepare & sign APK release files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/shorts-quiz-studio-debug.apk

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name zipalign | sort -V | tail -n 1)"

          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apks/shorts-quiz-studio-release.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
            ALIGNED="release-apks/app-release-aligned.apk"
            if [ -n "$ZIPALIGN" ]; then
              "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
            else
              cp "$UNSIGNED" "$ALIGNED"
            fi

            if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$APKSIGNER" ]; then
              printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/release.keystore
              "$APKSIGNER" sign \
                --ks /tmp/release.keystore \
                --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
                --ks-key-alias "${ANDROID_KEY_ALIAS}" \
                --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
                --out release-apks/shorts-quiz-studio-release.apk \
                "$ALIGNED"
              rm -f /tmp/release.keystore "$ALIGNED"
            elif [ -n "$APKSIGNER" ]; then
              if [ ! -f "$HOME/.android/debug.keystore" ]; then
                mkdir -p "$HOME/.android"
                keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
                  -storepass android -alias androiddebugkey -keypass android \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -dname "CN=Android Debug,O=Android,C=US"
              fi
              "$APKSIGNER" sign \
                --ks "$HOME/.android/debug.keystore" \
                --ks-pass pass:android \
                --ks-key-alias androiddebugkey \
                --key-pass pass:android \
                --out release-apks/shorts-quiz-studio-release.apk \
                "$ALIGNED"
              rm -f "$ALIGNED"
            else
              mv "$ALIGNED" release-apks/shorts-quiz-studio-release-unsigned.apk
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorts-quiz-studio-apk
          path: release-apks/*.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest APK Build (v1.0.${{ github.run_number }})" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body: |
            تم بناء تطبيق **استوديو شورتس الأسئلة (Shorts Quiz Studio)** تلقائياً (الإصدار `1.0.${{ github.run_number }}`):
            - **`shorts-quiz-studio-release.apk`**: نسخة جاهزة للتثبيت المباشر على أندرويد.
            - **`shorts-quiz-studio-debug.apk`**: نسخة Debug للاختبار.
          make_latest: true
          files: |
            release-apks/*.apk
